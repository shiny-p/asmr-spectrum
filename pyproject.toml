[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asmr-spectrum"
version = "1.0.0"
description = "Lossless audio concatenation plus spectral, low-frequency, loudness and energy-distribution analysis driven by ffmpeg + NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "shiny-p" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
asmr-spectrum = "asmr_spectrum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
